name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GrabNim
        run: |
          curl --fail --location --silent --show-error \
            https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh \
            --output "$RUNNER_TEMP/grabnim-install.sh"
          sh "$RUNNER_TEMP/grabnim-install.sh"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/grabnim/current/bin" >> "$GITHUB_PATH"

      - name: Install Nim devel nightly
        env:
          GRABNIM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          grabnim devel
          nim_root="$(grabnim path devel | tr -d '\r\"')"
          "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifler" \
            "$nim_root/dist/nimony/src/nifler/nifler.nim"
          "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifmake" \
            "$nim_root/dist/nimony/src/nifmake/nifmake.nim"

      - name: Show compiler version
        run: nim --version

      - name: Build aggregate module
        run: nim c binny.nim

      - name: Test native binding generation
        run: nim c -r tests/tnative_dynlib.nim

      - name: Test anonymous generic and named ref bindings
        run: nim c -r tests/tanonymous_generics.nim

      - name: Test native static library
        run: nim c -r tests/tnative_staticlib.nim

      - name: Build native dynlib example
        working-directory: examples/nim_native_dynlib
        run: nim build

      - name: Run native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

      - name: Build incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim build

      - name: Run incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify incremental move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

  native-dynlib:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GrabNim
        run: |
          curl --fail --location --silent --show-error \
            https://codeberg.org/janAkali/grabnim/raw/branch/master/misc/install.sh \
            --output "$RUNNER_TEMP/grabnim-install.sh"
          sh "$RUNNER_TEMP/grabnim-install.sh"
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/grabnim/current/bin" >> "$GITHUB_PATH"

      - name: Install Nim devel nightly
        if: runner.os != 'Windows'
        env:
          GRABNIM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          grabnim devel
          nim_root="$(grabnim path devel | tr -d '\r\"')"
          "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifler" \
            "$nim_root/dist/nimony/src/nifler/nifler.nim"
          "$nim_root/bin/nim" c -d:release --out:"$nim_root/bin/nifmake" \
            "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
          echo "$nim_root/bin" >> "$GITHUB_PATH"

      - name: Install Nim devel nightly (Windows)
        if: runner.os == 'Windows'
        env:
          GRABNIM_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/windows_x64.zip"
          extracted="$RUNNER_TEMP/nim-devel-extracted"
          curl --fail --location --silent --show-error \
            https://github.com/nim-lang/nightlies/releases/download/latest-devel/windows_x64.zip \
            --output "$archive"
          digest="$(gh api repos/nim-lang/nightlies/releases/tags/latest-devel \
            --jq '.assets[] | select(.name == "windows_x64.zip") | .digest')"
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --check -
          mkdir -p "$extracted"
          unzip -q "$archive" -d "$extracted"
          grabnim_root="$(cygpath -u "$LOCALAPPDATA")/grabnim"
          mkdir -p "$grabnim_root"
          mv "$extracted"/nim-* "$grabnim_root/nim-devel"
          grabnim devel
          nim_root="$(grabnim path devel | tr -d '\r\"')"
          nim_root="$(cygpath -u "$nim_root")"
          export PATH="/c/msys64/mingw64/bin:$nim_root/bin:$PATH"
          "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifler.exe" \
            "$nim_root/dist/nimony/src/nifler/nifler.nim"
          "$nim_root/bin/nim.exe" c -d:release --out:"$nim_root/bin/nifmake.exe" \
            "$nim_root/dist/nimony/src/nifmake/nifmake.nim"
          cygpath -w "$nim_root/bin" >> "$GITHUB_PATH"
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Show compiler version
        run: nim --version

      - name: Test anonymous generic and named ref bindings
        run: nim c -r tests/tanonymous_generics.nim

      - name: Test native static library
        run: nim c -r tests/tnative_staticlib.nim

      - name: Build native dynlib example
        working-directory: examples/nim_native_dynlib
        run: nim build

      - name: Run native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

      - name: Build incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim build

      - name: Run incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify incremental move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly
