name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nim 2.4.2
        run: |
          cd "$RUNNER_TEMP"
          archive=nim-2.4.2-linux_x64.tar.xz
          curl -fsSLO "https://nim-lang.org/download/$archive"
          curl -fsSLO "https://nim-lang.org/download/$archive.sha256"
          sha256sum --check "$archive.sha256"
          tar -xf "$archive"
          echo "$RUNNER_TEMP/nim-2.4.2/bin" >> "$GITHUB_PATH"

      - name: Install native binding test dependencies
        run: atlas install --feature:test

      - name: Show compiler version
        run: nim --version

      - name: Build aggregate module
        run: nim c binny.nim

      - name: Test native binding generation
        run: nim c -r tests/tnative_dynlib.nim

      - name: Test imported native types
        run: nim c -r tests/tnative_dynlib_imported_types.nim

      - name: Test imported generic arguments and nil method overloads
        run: nim c -r tests/tnative_dynlib_siwin_types.nim

      - name: Test anonymous generic and named ref bindings
        run: nim c -r tests/tanonymous_generics.nim

      - name: Test native static library
        run: nim c -r tests/tnative_staticlib.nim

      - name: Test direct C-backend exports and inline thunks
        run: nim c -r tests/tnative_dynlib_c_exports.nim

      - name: Test native exception bridging
        run: nim c -r tests/tnative_dynlib_exceptions.nim

      - name: Build native dynlib producer
        working-directory: examples/nim_native_dynlib
        run: nim buildProducer

      - name: Generate native dynlib bindings
        working-directory: examples/nim_native_dynlib
        run: nim generateBindings

      - name: Build native dynlib consumer
        working-directory: examples/nim_native_dynlib
        run: nim buildConsumer

      - name: Run native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

      - name: Build incremental native dynlib producer
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim buildProducer

      - name: Generate incremental native dynlib bindings
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim generateBindings

      - name: Build incremental native dynlib consumer
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim buildConsumer

      - name: Run incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify incremental move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

  native-dynlib:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nim 2.4.2
        run: |
          cd "$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            archive=nim-2.4.2_x64.zip
          elif [ "$RUNNER_ARCH" = ARM64 ]; then
            archive=nim-2.4.2-macosx_arm64.tar.xz
          else
            archive=nim-2.4.2-macosx_x64.tar.xz
          fi
          curl -fsSLO "https://nim-lang.org/download/$archive"
          curl -fsSLO "https://nim-lang.org/download/$archive.sha256"
          if [ "$RUNNER_OS" = Windows ]; then
            sha256sum --check "$archive.sha256"
            unzip -q "$archive"
            nim_root="$(cygpath -m "$PWD/nim-2.4.2")"
            exe=.exe
            export PATH="/c/msys64/mingw64/bin:$PATH"
            cygpath -w "$nim_root/bin" >> "$GITHUB_PATH"
            printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          else
            shasum -a 256 --check "$archive.sha256"
            tar -xf "$archive"
            nim_root="$PWD/nim-2.4.2"
            exe=
            echo "$nim_root/bin" >> "$GITHUB_PATH"
          fi
          for tool in nifler nifmake; do
            if [ ! -f "$nim_root/bin/$tool$exe" ]; then
              "$nim_root/bin/nim$exe" c -d:release --out:"$nim_root/bin/$tool$exe" \
                "$nim_root/dist/nimony/src/$tool/$tool.nim"
            fi
          done

      - name: Show compiler version
        run: nim --version

      - name: Test native binding generation and runtime guards
        run: nim c -r tests/tnative_dynlib.nim

      - name: Test anonymous generic and named ref bindings
        run: nim c -r tests/tanonymous_generics.nim

      - name: Test native static library
        run: nim c -r tests/tnative_staticlib.nim

      - name: Test direct C-backend exports and inline thunks
        run: nim c -r tests/tnative_dynlib_c_exports.nim

      - name: Build native dynlib producer
        working-directory: examples/nim_native_dynlib
        run: nim buildProducer

      - name: Generate native dynlib bindings
        working-directory: examples/nim_native_dynlib
        run: nim generateBindings

      - name: Build native dynlib consumer
        working-directory: examples/nim_native_dynlib
        run: nim buildConsumer

      - name: Run native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly

      - name: Build incremental native dynlib producer
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim buildProducer

      - name: Generate incremental native dynlib bindings
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim generateBindings

      - name: Build incremental native dynlib consumer
        working-directory: examples/nim_native_dynlib
        env:
          BINNY_NATIVE_BACKEND: ic
        run: nim buildConsumer

      - name: Run incremental native dynlib example
        working-directory: examples/nim_native_dynlib
        run: ./consumer

      - name: Verify incremental move-only native binding
        working-directory: examples/nim_native_dynlib
        run: nim checkMoveOnly
